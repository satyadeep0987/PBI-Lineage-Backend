name: Backend CD

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pbi-lineage-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Backend

    if: >-
      vars.DEPLOYMENT_ENABLED == 'true' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        )
      )

    runs-on: windows-2025

    environment:
      name: production
      url: https://lvpowerbilineage.com

    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}

      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}

      BACKEND_CONTAINER_NAME: ${{ vars.BACKEND_CONTAINER_NAME }}
      BACKEND_HOST_PORT: ${{ vars.BACKEND_HOST_PORT }}
      BACKEND_CONTAINER_PORT: ${{ vars.BACKEND_CONTAINER_PORT }}

      MSOLAP_MSI_URL: ${{ vars.MSOLAP_MSI_URL }}

    steps:
      - name: Resolve release SHA
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_run") {
              $sha = "${{ github.event.workflow_run.head_sha }}"
          }
          else {
              $sha = "${{ github.sha }}"
          }

          if ([string]::IsNullOrWhiteSpace($sha)) {
              throw "Unable to resolve release SHA."
          }

          "RELEASE_SHA=$sha" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Windows Docker daemon is ready
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking Docker service..."

          $dockerService = Get-Service `
              -Name docker `
              -ErrorAction SilentlyContinue

          if (-not $dockerService) {
              throw "Docker service is not installed on this runner."
          }

          Write-Host "Initial Docker service state: $($dockerService.Status)"

          # GitHub-hosted Windows runners currently have an intermittent
          # Docker/HNS initialization issue. Restarting the service is the
          # recommended workaround.
          Write-Host "Restarting Docker service..."

          Restart-Service `
              -Name docker `
              -Force

          $maxAttempts = 12
          $ready = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {

              Write-Host "Docker readiness attempt $attempt/$maxAttempts"

              docker info *> $null

              if ($LASTEXITCODE -eq 0) {
                  $ready = $true
                  break
              }

              Start-Sleep -Seconds 5
          }

          if (-not $ready) {
              Write-Host "Docker service details:"
              Get-Service docker | Format-List *

              throw "Docker daemon did not become ready."
          }

          docker version

          $osType = docker info `
              --format '{{.OSType}}'

          Write-Host "Docker OS type: $osType"

          if ($osType -ne "windows") {
              throw "Windows Docker daemon required. Found '$osType'."
          }

          Write-Host "Windows Docker daemon is ready."

      - name: Resolve ACR login server
        shell: pwsh
        run: |
          $loginServer = az acr show `
              --name $env:ACR_NAME `
              --query loginServer `
              --output tsv

          if ([string]::IsNullOrWhiteSpace($loginServer)) {
              throw "Unable to resolve ACR login server."
          }

          "ACR_LOGIN_SERVER=$loginServer" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Login to ACR
        shell: pwsh
        run: |
          az acr login `
              --name $env:ACR_NAME

          if ($LASTEXITCODE -ne 0) {
              throw "ACR login failed."
          }

      - name: Calculate image name
        shell: pwsh
        run: |
          $image = "{0}/{1}:{2}" -f `
              $env:ACR_LOGIN_SERVER,
              $env:ACR_REPOSITORY,
              $env:RELEASE_SHA

          "BACKEND_IMAGE=$image" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Image: $image"

      - name: Validate MSOLAP configuration
        shell: pwsh
        run: |
          if (
              [string]::IsNullOrWhiteSpace(
                  $env:MSOLAP_MSI_URL
              )
          ) {
              throw "MSOLAP_MSI_URL is missing."
          }

      - name: Build backend image
        shell: pwsh
        run: |
          docker build `
              --pull `
              --build-arg `
                "MSOLAP_MSI_URL=$env:MSOLAP_MSI_URL" `
              --tag $env:BACKEND_IMAGE `
              .

          if ($LASTEXITCODE -ne 0) {
              throw "Backend Docker build failed."
          }

      - name: Push backend image
        shell: pwsh
        run: |
          docker push $env:BACKEND_IMAGE

          if ($LASTEXITCODE -ne 0) {
              throw "Backend image push failed."
          }

      - name: Deploy backend to Azure VM
        shell: pwsh
        run: |
          $output = az vm run-command invoke `
              --resource-group $env:AZURE_RESOURCE_GROUP `
              --name $env:AZURE_VM_NAME `
              --command-id RunPowerShellScript `
              --scripts "@.azure/scripts/deploy-backend.ps1" `
              --parameters `
                  "Image=$env:BACKEND_IMAGE" `
                  "AcrName=$env:ACR_NAME" `
                  "ContainerName=$env:BACKEND_CONTAINER_NAME" `
                  "HostPort=$env:BACKEND_HOST_PORT" `
                  "ContainerPort=$env:BACKEND_CONTAINER_PORT" `
              --query "value[].message" `
              --output tsv

          $output | Write-Host

          $combined = $output -join "`n"

          if (
              $combined -notmatch
              "DEPLOYMENT_RESULT=SUCCESS"
          ) {
              throw (
                  "VM deployment did not return " +
                  "the success marker."
              )
          }

      - name: Public backend smoke test
        shell: pwsh
        run: |
          $live = Invoke-WebRequest `
              -Uri (
                  "https://lvpowerbilineage.com" +
                  "/api/v1/health/live"
              ) `
              -UseBasicParsing `
              -TimeoutSec 30

          $ready = Invoke-WebRequest `
              -Uri (
                  "https://lvpowerbilineage.com" +
                  "/api/v1/health/ready"
              ) `
              -UseBasicParsing `
              -TimeoutSec 30

          if (
              $live.StatusCode -ne 200 -or
              $ready.StatusCode -ne 200
          ) {
              throw "Public backend smoke test failed."
          }

      - name: Deployment summary
        shell: pwsh
        run: |
          Write-Host "Backend deployment successful."
          Write-Host "Release: $env:RELEASE_SHA"
          Write-Host "Image:   $env:BACKEND_IMAGE"