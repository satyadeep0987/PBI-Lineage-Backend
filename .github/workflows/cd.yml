name: Backend CD

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pbi-lineage-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Backend

    if: >-
      vars.DEPLOYMENT_ENABLED == 'true' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        )
      )

    runs-on: windows-2025

    environment:
      name: production
      url: https://lvpowerbilineage.com

    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
      BACKEND_CONTAINER_NAME: ${{ vars.BACKEND_CONTAINER_NAME }}
      BACKEND_HOST_PORT: ${{ vars.BACKEND_HOST_PORT }}
      BACKEND_CONTAINER_PORT: ${{ vars.BACKEND_CONTAINER_PORT }}
      MSOLAP_MSI_URL: ${{ vars.MSOLAP_MSI_URL }}

    steps:
      - name: Resolve release SHA
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_run") {
              $sha = "${{ github.event.workflow_run.head_sha }}"
          }
          else {
              $sha = "${{ github.sha }}"
          }

          if ([string]::IsNullOrWhiteSpace($sha)) {
              throw "Unable to resolve release SHA."
          }

          "RELEASE_SHA=$sha" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Release SHA: $sha"

      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Windows container runtime
        shell: pwsh
        run: |
          docker version

          $osType = docker info `
              --format '{{.OSType}}'

          Write-Host "Docker OS type: $osType"

          if ($osType -ne "windows") {
              throw (
                  "Windows Docker daemon is required. " +
                  "Detected: $osType"
              )
          }

      - name: Login to Azure Container Registry
        shell: pwsh
        run: |
          az acr login `
              --name $env:ACR_NAME

          if ($LASTEXITCODE -ne 0) {
              throw "Azure Container Registry login failed."
          }

      - name: Calculate image name
        shell: pwsh
        run: |
          $loginServer = "$($env:ACR_NAME).azurecr.io"

          $image = "{0}/{1}:{2}" -f `
              $loginServer,
              $env:ACR_REPOSITORY,
              $env:RELEASE_SHA

          Write-Host "Image: $image"

          "BACKEND_IMAGE=$image" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Build Windows backend image
        shell: pwsh
        run: |
          docker build `
              --pull `
              --tag $env:BACKEND_IMAGE `
              .

          if ($LASTEXITCODE -ne 0) {
              throw "Backend Docker build failed."
          }

      - name: Inspect built image
        shell: pwsh
        run: |
          docker image inspect `
              $env:BACKEND_IMAGE `
              | Out-Null

          if ($LASTEXITCODE -ne 0) {
              throw "Built image could not be inspected."
          }

      - name: Push backend image
        shell: pwsh
        run: |
          docker push `
              $env:BACKEND_IMAGE

          if ($LASTEXITCODE -ne 0) {
              throw "Backend image push failed."
          }

      - name: Deploy backend to Azure VM
        shell: pwsh
        run: |
          az vm run-command invoke `
              --resource-group $env:AZURE_RESOURCE_GROUP `
              --name $env:AZURE_VM_NAME `
              --command-id RunPowerShellScript `
              --scripts "@.azure/scripts/deploy-backend.ps1" `
              --parameters `
                  "Image=$env:BACKEND_IMAGE" `
                  "ContainerName=$env:BACKEND_CONTAINER_NAME" `
                  "HostPort=$env:BACKEND_HOST_PORT" `
                  "ContainerPort=$env:BACKEND_CONTAINER_PORT"

          if ($LASTEXITCODE -ne 0) {
              throw "Backend VM deployment failed."
          }

      - name: Deployment summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "Backend deployment completed."
          Write-Host "Release: $env:RELEASE_SHA"
          Write-Host "Image:   $env:BACKEND_IMAGE"