[project]
name = "pbi-lineage-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "msal>=1.38.0",
    "pydantic-settings>=2.15.0",
    "snowflake-connector-python>=4.0,<5",
    "pywin32>=312; platform_system == 'Windows'",
    "snowflake-snowpark-python>=1.54.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
